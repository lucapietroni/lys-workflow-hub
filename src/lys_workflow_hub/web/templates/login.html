<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accedi · LYS Workflow Hub</title>
    <link rel="stylesheet" href="/static/style.css?v={{ version }}" />
    <style>
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card { width: 100%; max-width: 380px; }
      .login-logo {
        display: block;
        margin: 0 auto 20px;
        max-width: 160px;
      }
      .login-title {
        text-align: center;
        margin: 0 0 24px;
        color: var(--lys-grey-900);
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <img class="login-logo" src="/static/logo-lys.jpg" alt="LYS Auto" />
        <h2 class="login-title">Workflow Hub · Accesso</h2>

        {% if error %}
        <div class="alert alert-warn">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next }}" />

          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus autocomplete="username" />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" required autocomplete="current-password" />
              <button type="button" class="password-toggle" data-target="password" aria-label="Mostra password" tabindex="-1">👁</button>
            </div>
          </div>

          <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 12px;">
            Accedi
          </button>
        </form>
      </div>
    </div>

    <script>
      document.querySelectorAll(".password-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var input = document.getElementById(btn.getAttribute("data-target"));
          if (!input) return;
          var showing = input.type === "text";
          input.type = showing ? "password" : "text";
          btn.textContent = showing ? "👁" : "🙈";
          btn.setAttribute("aria-label", showing ? "Mostra password" : "Nascondi password");
        });
      });
    </script>
  </body>
</html>
