<!-- Toggle sblocco biometrico, riusato da impostazioni.html (admin) e
     portale_impostazioni.html (esterno/supervisore) — stesso markup/JS,
     evita di duplicare ~60 righe identiche in due template. -->
<section class="card app-only biometric-toggle-section">
  <div class="form-field">
    <label style="display:flex;align-items:center;gap:8px;">
      <input id="f_biometria" type="checkbox" style="width:auto;" />
      Accesso biometrico
    </label>
    <small class="hint">
      Chiede l'impronta o il riconoscimento facciale ogni volta che apri
      l'app, così chi prende in mano il telefono sbloccato non entra
      direttamente nelle tue pratiche.
    </small>
    <p id="biometria-stato" class="hint"></p>
  </div>
</section>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var check = document.getElementById("f_biometria");
    var stato = document.getElementById("biometria-stato");
    var sezione = document.querySelector(".biometric-toggle-section");
    if (!check || !stato || !sezione) return;

    var isApp = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
    if (!isApp) return;

    var NativeBiometric = window.Capacitor.Plugins.NativeBiometric;
    if (!NativeBiometric) {
      sezione.style.display = "none";
      return;
    }

    function attiva() {
      try {
        return localStorage.getItem("lys_biometric_lock") === "1";
      } catch (e) {
        return false;
      }
    }

    NativeBiometric.isAvailable()
      .then(function (result) {
        if (!result.isAvailable) {
          sezione.style.display = "none";
          return;
        }
        check.checked = attiva();
      })
      .catch(function () {
        sezione.style.display = "none";
      });

    check.addEventListener("change", function () {
      // Sia attivare che DISATTIVARE richiedono una verifica biometrica
      // riuscita — altrimenti chi trova il telefono con l'app già aperta
      // potrebbe entrare in Impostazioni e spegnere la protezione senza
      // dover provare nulla. Il checkbox si aggiorna solo dopo la verifica.
      var vogliAttivare = check.checked;
      check.checked = !vogliAttivare; // stato visivo invariato finché non si conferma
      check.disabled = true;
      stato.textContent = "Verifica in corso...";
      var motivo = vogliAttivare ? "Conferma per attivare lo sblocco" : "Conferma per disattivare lo sblocco";
      NativeBiometric.verifyIdentity({ reason: motivo, title: "LYS Hub", useFallback: true })
        .then(function () {
          try {
            if (vogliAttivare) {
              localStorage.setItem("lys_biometric_lock", "1");
              localStorage.setItem("lys_last_unlock_ts", String(Date.now()));
            } else {
              localStorage.removeItem("lys_biometric_lock");
              localStorage.removeItem("lys_last_unlock_ts");
              localStorage.removeItem("lys_last_background_ts");
            }
          } catch (e) {}
          check.checked = vogliAttivare;
          stato.textContent = vogliAttivare ? "Attivo." : "Disattivato.";
          check.disabled = false;
        })
        .catch(function () {
          check.checked = !vogliAttivare; // nessun cambiamento, verifica non riuscita
          check.disabled = false;
          stato.textContent = "Verifica non riuscita, nessuna modifica.";
        });
    });
  });
</script>
