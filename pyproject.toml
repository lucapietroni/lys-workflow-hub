[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lys-workflow-hub"
version = "4.11.1"
description = "Piattaforma di automazione documentale per Carrozzeria LYS Auto srl, integrata con WinCar."
requires-python = ">=3.11"
authors = [{ name = "Luca Pietroni", email = "luca.pietroni@gmail.com" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-docx>=1.1",
    "anthropic>=0.28",
    "watchdog>=4.0",
    "Pillow>=10.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
