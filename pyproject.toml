[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lys-workflow-hub"
version = "0.4.0.dev1"
description = "Piattaforma di automazione documentale per Carrozzeria LYS Auto srl, integrata con WinCar."
requires-python = ">=3.11"
authors = [{ name = "Luca Pietroni", email = "luca.pietroni@gmail.com" }]
readme = "README.md"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
